name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Read version
        id: v
        run: echo "version=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - building with a temporary debug key (phone updates won't install over it)."
          fi

      - name: Build Hub Connect S
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_VERSION: ${{ steps.v.outputs.version }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package release files
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/HubConnectS-v${V}.apk"
          cp VERSION desktop/VERSION
          mv desktop StellarHub
          zip -r "out/StellarHub-v${V}.zip" StellarHub -x '*/__pycache__/*' 'StellarHub/data/*'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          body: ""
          files: out/*
