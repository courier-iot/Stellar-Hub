name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Uploading through GitHub's web page can make several commits at once. Only the newest build
# runs, so two builds never fight over the same release.
concurrency:
  group: release-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Read version
        id: v
        run: echo "version=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - building with a temporary debug key (phone updates won't install over it)."
          fi

      - name: Build Hub Connect S
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APP_VERSION: ${{ steps.v.outputs.version }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Package release files
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/HubConnectS-v${V}.apk"
          cp VERSION desktop/VERSION
          mv desktop StellarHub
          zip -r "out/StellarHub-v${V}.zip" StellarHub -x '*/__pycache__/*' 'StellarHub/data/*' 'StellarHub/config.json'
          cd out && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          gh release view "v${V}" > /dev/null 2>&1 || gh release create "v${V}" --title "v${V}" --notes "" --target "${GITHUB_SHA}" --latest
          gh release upload "v${V}" out/* --clobber
          gh release edit "v${V}" --latest

  windows-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        shell: pwsh
        run: echo "version=$((Get-Content VERSION -Raw).Trim())" >> $env:GITHUB_OUTPUT

      - name: Get Python (bundled into the installer)
        shell: pwsh
        run: |
          $py = "3.12.8"
          Invoke-WebRequest "https://www.python.org/ftp/python/$py/python-$py-embed-amd64.zip" -OutFile py.zip
          Expand-Archive py.zip -DestinationPath build/python
          # Certificate bundle so the bundled Python can make secure connections (updates, web research)
          python -m pip install --quiet certifi
          Copy-Item (python -c "import certifi; print(certifi.where())") build/python/cacert.pem

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.v.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\StellarHub.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem out\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value "$h  $($_.Name)" -NoNewline
          }

      - name: Add installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          gh release view "v$env:V" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "v$env:V" --title "v$env:V" --notes "" --target "$env:GITHUB_SHA" --latest }
          gh release upload "v$env:V" (Get-ChildItem out\*.exe, out\*.sha256).FullName --clobber
